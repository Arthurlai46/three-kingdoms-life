<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>三國文字人生 v0.1.3 Alpha</title>
<style>
:root{--bg:#efe3c4;--panel:#fff8e8;--ink:#30271c;--muted:#756a58;--line:#b79b68;--accent:#7b2d26;--btn:#f4e6c5;--good:#2f6b45;--bad:#8c2e2e}
[data-theme="dark"]{--bg:#171716;--panel:#23221f;--ink:#eee3cc;--muted:#aaa18e;--line:#665b47;--accent:#c8846d;--btn:#302e29;--good:#82c99b;--bad:#df8b83}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;line-height:1.55}
button,input,select,textarea{font:inherit}.app{max-width:1180px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{font-weight:800}.small{font-size:.88rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:230px 1fr 250px;gap:12px;padding:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 2px 7px #0001}.story{min-height:420px}.title{font-size:1.25rem;font-weight:800;color:var(--accent);margin-bottom:8px}.narrative{white-space:pre-line;margin:10px 0 16px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.actions button,.nav button,.primary,.secondary{border:1px solid var(--line);background:var(--btn);color:var(--ink);padding:11px 10px;border-radius:8px;cursor:pointer}.actions button:hover,.nav button:hover{filter:brightness(.97)}.primary{background:var(--accent);color:white;border-color:var(--accent)}.nav{display:grid;gap:7px}.stat{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:4px 0}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin:2px;font-size:.8rem}.msg{padding:7px 0;border-bottom:1px dotted var(--line);font-size:.9rem}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}.modal.show{display:flex}.box{width:min(760px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid label{display:grid;gap:4px}.full{grid-column:1/-1}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.screen{display:none}.screen.active{display:block}.home{max-width:760px;margin:8vh auto;padding:18px}.hero{text-align:center;padding:24px}.hero h1{font-size:2rem;margin:.2em}.homeBtns{display:grid;gap:10px;max-width:430px;margin:20px auto}.homeBtns button{padding:13px}.log{max-height:280px;overflow:auto}.danger{color:var(--bad)}.good{color:var(--good)}
@media(max-width:850px){.grid{grid-template-columns:1fr}.left,.right{display:none}.story{min-height:0}.actions{grid-template-columns:1fr 1fr}.top{position:static}}
@media(max-width:480px){.actions{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<section id="home" class="screen active home">
 <div class="panel hero">
  <div class="small">單機 Alpha ・ 存檔格式 1</div><h1>三國文字人生</h1>
  <p>中平元年，黃巾四起。你不是歷史的旁觀者，而是活在其中的一個人。</p>
  <div class="homeBtns">
   <button class="primary" onclick="openCreate()">開始新人生</button>
   <button onclick="continueGame()">繼續遊戲</button>
   <button onclick="openSaves()">存檔管理／備份碼</button>
   <button onclick="observerStart()">觀察者模式</button>
   <button onclick="showChangelog()">更新紀錄</button>
  </div>
  <p class="small">v0.1.3 Alpha：勢力與城池、仕官自薦、人物地域、三層情報、技能傳授、任務經濟與金錢修正。</p>
  <div id="compat" class="small" style="margin-top:12px;padding:9px;border:1px dashed var(--line);border-radius:8px">正在檢查瀏覽器相容性…</div>
 </div>
</section>

<section id="game" class="screen">
 <div class="top"><div><span class="brand">三國文字人生</span> <span id="dateTop" class="small"></span></div><div><button onclick="toggleTheme()">◐</button> <button onclick="quickSave()">儲存</button> <button onclick="goHome()">首頁</button></div></div>
 <div class="grid">
  <aside class="panel left"><div class="title">人物</div><div id="playerStats"></div><hr><div class="title">能力</div><div id="abilities"></div></aside>
  <main class="panel story"><div id="sceneTitle" class="title"></div><div id="sceneMeta" class="small"></div><div id="narrative" class="narrative"></div><div id="actions" class="actions"></div></main>
  <aside class="panel right"><div class="title">功能</div><div class="nav">
   <button onclick="showPeople()">人物</button><button onclick="showMap()">地圖／旅行</button><button onclick="showIntel()">情報</button><button onclick="showTasks()">任務</button><button onclick="showJournal()">日誌</button><button onclick="showFaction()">勢力</button><button onclick="openSaves()">存檔</button>
  </div><hr><div class="title">消息</div><div id="messages" class="log"></div></aside>
 </div>
</section>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="modalBox"></div></div>

<script>
const VERSION="0.1.3", SAVE_VERSION=3;
const CITIES=[
["洛陽","司隸"],["長安","司隸"],["陳留","兗州"],["濮陽","兗州"],["許昌","豫州"],["汝南","豫州"],["譙","豫州"],["鄴","冀州"],["南皮","冀州"],["平原","青州"],["北海","青州"],["薊","幽州"],["遼東","幽州"],["晉陽","并州"],["上黨","并州"],["宛","荊州"],["襄陽","荊州"],["江陵","荊州"],["長沙","荊州"],["壽春","揚州"],["建業","揚州"],["吳","揚州"],["會稽","揚州"],["柴桑","揚州"],["成都","益州"],["漢中","益州"],["梓潼","益州"],["江州","益州"],["武威","涼州"],["天水","涼州"]
].map((x,i)=>({id:i,name:x[0],region:x[1],prosperity:55+((i*7)%31),order:50+((i*11)%36),food:60+((i*13)%35),price:90+((i*17)%35)}));
const HIST_NAMES=["劉備","關羽","張飛","曹操","袁紹","袁術","孫堅","孫策","孫權","董卓","呂布","丁原","何進","皇甫嵩","朱儁","盧植","公孫瓚","陶謙","劉表","劉焉","馬騰","韓遂","張角","張寶","張梁","荀彧","荀攸","郭嘉","程昱","戲志才","夏侯惇","夏侯淵","曹仁","曹洪","典韋","許褚","于禁","樂進","李典","張遼","高順","陳宮","賈詡","李儒","華雄","顏良","文醜","田豐","沮授","審配","麴義","趙雲","太史慈","周瑜","魯肅","張昭","程普","黃蓋","韓當","祖茂","甘寧","黃忠","魏延","蔡瑁","蒯越","龐統","諸葛亮","諸葛瑾","徐庶","司馬徽","華佗","張仲景","孔融","王允","貂蟬","蔡邕","蔡琰","陳登","張繡","劉虞"];
const COGNOMEN={"劉備":"玄德","關羽":"雲長","張飛":"翼德","曹操":"孟德","袁紹":"本初","孫堅":"文臺","呂布":"奉先","諸葛亮":"孔明","趙雲":"子龍","周瑜":"公瑾","郭嘉":"奉孝","荀彧":"文若","賈詡":"文和"};
let state=null;

function rng(n){return Math.floor(Math.random()*n)}
function lsGet(k,fallback=""){try{let v=localStorage.getItem(k);return v===null?fallback:v}catch(e){return fallback}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function peopleSeed(){
 return HIST_NAMES.map((name,i)=>({id:"h"+i,name,zi:COGNOMEN[name]||"",age:16+((i*7)%34),city:i%CITIES.length,
 stats:{lead:55+((i*13)%40),war:45+((i*17)%51),int:50+((i*19)%47),pol:45+((i*23)%50),cha:50+((i*29)%46)},
 relation:{affection:0,trust:0,respect:0,debt:0,hatred:0,love:0},known:i<5?1:0,alive:true,faction:null,traits:[]}));
}
function freshState(p){
 return {version:VERSION,saveVersion:SAVE_VERSION,mode:"normal",date:{y:184,m:3,d:1},player:p,
 city:p.city,people:peopleSeed(),money:300,health:100,stamina:100,fame:0,historyDeviation:0,
 faction:null,rank:"平民",journal:[],messages:[],tasks:[],flags:{yellowTurban:false},turn:0,theme:lsGet("sg_theme","paper")};
}
function openCreate(){
 modal(`<div class="title">建立人物</div><div class="formgrid">
 <label>姓名<input id="cname" value="" placeholder="請輸入姓名"></label><label>字<input id="czi" placeholder="可留白"></label>
 <label>性別<select id="csex"><option>男</option><option>女</option></select></label>
 <label>年齡<input id="cage" type="number" min="16" max="40" value="20"></label>
 <label>出生／開局地<select id="ccity">${CITIES.map(c=>`<option value="${c.id}">${c.region}・${c.name}</option>`).join("")}</select></label>
 <label>出身<select id="cbg"><option>寒門</option><option>農家</option><option>商家</option><option>士族</option><option>武人之家</option><option>官宦之家</option><option>遊俠</option><option>醫家</option></select></label>
 <label class="full">性格<select id="cperson"><option>沉著重義</option><option>豪爽果決</option><option>謹慎務實</option><option>仁厚守信</option><option>野心勃勃</option><option>淡泊自由</option></select></label>
 </div><p class="small">v0.1採背景式能力生成；自由配點與問卷生成已保留後續擴充位置。</p>
 <div class="toolbar"><button class="primary" onclick="createChar()">進入中平元年</button><button onclick="saveTemplate()">保存人物模板</button><button onclick="loadTemplate()">載入模板</button><button onclick="closeModal()">取消</button></div>`);
}
function charFormData(){return {name:val("cname"),zi:val("czi"),sex:val("csex"),age:+val("cage"),city:+val("ccity"),background:val("cbg"),personality:val("cperson")}}
function createChar(){
 let p=charFormData(); if(!p.name)return alert("請輸入姓名");
 let b={lead:58,war:58,int:58,pol:58,cha:58}, bg=p.background;
 if(bg==="武人之家"){b.war+=12;b.lead+=7} if(bg==="官宦之家"){b.pol+=12;b.cha+=6} if(bg==="士族"){b.int+=12;b.pol+=7}
 if(bg==="商家"){b.cha+=9;b.pol+=6} if(bg==="遊俠"){b.war+=10;b.cha+=5} if(bg==="醫家"){b.int+=10;b.cha+=4} if(bg==="農家"){b.war+=5;b.lead+=4}
 p.stats=b;p.potential={lead:80+rng(21),war:80+rng(21),int:80+rng(21),pol:80+rng(21),cha:80+rng(21)};p.skills={武藝:1,學問:1,交涉:1};p.exp={};
 state=freshState(p); addJournal(`中平元年三月，你以${p.age}歲之齡，身在${CITIES[p.city].name}。亂世的人生由此開始。`); closeModal();enterGame(); renderCity();
}
function saveTemplate(){let p=charFormData();let arr=JSON.parse(lsGet("sg_templates","[]"));arr.push(p);lsSet("sg_templates",JSON.stringify(arr));alert("人物模板已保存。")}
function loadTemplate(){let a=JSON.parse(lsGet("sg_templates","[]"));if(!a.length)return alert("尚無模板");let p=a[a.length-1];["cname","czi","csex","cage","ccity","cbg","cperson"].forEach((id,i)=>document.getElementById(id).value=[p.name,p.zi,p.sex,p.age,p.city,p.background,p.personality][i]);}
function enterGame(){show("game");document.body.dataset.theme=state.theme==="dark"?"dark":"";refreshSide()}
function renderCity(){
 let c=CITIES[state.city], tension=state.date.y===184?"黃巾之亂的消息在道路與酒肆間流傳，官府的盤查也比往常嚴格。":"天下局勢仍在變化。";
 scene(c.name,`${c.region}｜治安 ${c.order}｜繁榮 ${c.prosperity}`,`你身在${c.name}。${tension}\n商旅、士人、兵卒與百姓各自奔走，沒有人知道數年後的天下會變成什麼模樣。`,[
 ["前往酒肆",tavern],["前往市集",market],["修練",train],["打聽消息",rumor],["拜訪人物",showPeople],["官府／仕官",government],["地圖／旅行",showMap],["休息三日",()=>{advance(3,"你暫且休息，整理思緒與體力。");state.stamina=Math.min(100,state.stamina+25);renderCity()}]
 ]);
}
function tavern(){advance(1);let pool=state.people.filter(p=>p.alive&&p.city===state.city);let p=pool[rng(Math.max(1,pool.length))];let text=pool.length?`酒肆中人聲嘈雜。你注意到一名${p.age}歲上下的人物——${p.known?p.name:"陌生旅人"}。`:"今日酒肆沒有特別引人注目的人。";scene("酒肆","消息與人脈的交會處",text,[["主動攀談",()=>meet(p)],["聽鄰桌談話",rumor],["請眾人喝酒（30錢）",()=>{if(pay(30)){state.fame++;advance(1);note("你在酒肆頗為豪爽，略有耳聞。");renderCity()}}],["尋找委託",generateTask],["觀察四周",()=>{advance(1);rumor()}],["返回",renderCity]])}
function meet(p){if(!p)return renderCity();p.known=Math.max(p.known,2);p.relation.affection+=2+rng(4);p.relation.trust+=rng(3);advance(1);scene("人物相識",p.zi?`${p.name}，字${p.zi}`:p.name,`${p.name}與你交談片刻。從言談中，你只能初步判斷此人的氣質與見識；真正能力仍需長期接觸。`,[["談論天下",()=>{p.relation.respect+=state.player.stats.int>65?3:1;advance(1);renderCity()}],["談論兵法",()=>{p.relation.respect+=state.player.stats.lead>65?3:1;advance(1);renderCity()}],["詢問近況",()=>{p.relation.trust+=2;advance(1);renderCity()}],["贈送薄禮（50）",()=>{if(pay(50)){p.relation.affection+=4;advance(1);renderCity()}}],["告辭",renderCity]])}
function market(){let c=CITIES[state.city];scene("市集",`目前糧價指數 ${c.price}`,`市集貨物來往。戰亂與收成會逐漸改變各地價格。\n你目前有 ${state.money} 錢。`,[["做短工（+40錢／2日）",()=>{state.money+=40;advance(2,"你在市集做了兩日短工。");renderCity()}],["購買旅糧（30錢）",()=>{if(pay(30)){note("你補充了旅途所需。");renderCity()}}],["觀察物價",()=>{advance(1);renderCity()}],["打聽商路",rumor],["返回",renderCity]])}
function train(){scene("修練","能力越高，成長越困難。","你準備花七日專心修練。選擇方向：",[["統率",()=>grow("lead")],["武力",()=>grow("war")],["智力",()=>grow("int")],["政治",()=>grow("pol")],["魅力",()=>grow("cha")],["取消",renderCity]])}
function grow(k){advance(7);let s=state.player.stats[k],pot=state.player.potential[k],chance=Math.max(8,75-s*.55);if(s<100&&s<pot&&Math.random()*100<chance){state.player.stats[k]++;note(`七日修練有所領悟，${label(k)}提升至 ${state.player.stats[k]}。`)}else note("你勤練七日，雖有所體會，能力尚未突破。");renderCity()}
function rumor(){advance(1);let r=["黃巾軍在數地活動頻繁，但傳聞中的兵力數字彼此矛盾。","有人說朝廷正在調集兵馬，也有人說地方官府已難以控制局面。","北來商旅聲稱道路不靖，部分商隊開始改道。","酒客談到一名年輕豪傑正在招募鄉勇；消息來源並不可靠。","數名旅人都提到洛陽近日政局緊張，說法雖不同，方向卻頗為一致。"][rng(5)];note("傳聞："+r);scene("市井傳聞","可信度需自行判斷",r,[["繼續查證",rumor],["記下消息",()=>{addJournal("聽聞："+r);renderCity()}],["返回",renderCity]])}
function government(){scene("官府",state.faction?`目前身分：${state.rank}`:"尚未仕官",state.faction?"你已進入地方官府體系，v0.1可接受基礎差事並累積名聲。":"亂世之中，官府正在徵募能辦事之人。",[["應募地方差役",()=>{if(!state.faction){state.faction="地方官府";state.rank="佐吏";state.fame+=3;addJournal(`你在${CITIES[state.city].name}應募入官府，成為佐吏。`)}advance(3);renderCity()}],["接受剿匪差事",banditBattle],["詢問政務",()=>{advance(1);note("你對本地民情與治安多了一些了解。");renderCity()}],["返回",renderCity]])}
function banditBattle(){let power=state.player.stats.war+state.player.stats.lead+rng(40),enemy=115+rng(45);advance(5);if(power>=enemy){state.fame+=5;state.money+=100;addJournal(`你參與${CITIES[state.city].name}附近的剿匪行動並取得勝利。`);note("剿匪成功，獲得100錢與名聲。")}else{state.health-=10+rng(16);note("剿匪失利，你在混戰中受傷。");addJournal("一次剿匪行動失利，你帶傷返回。")}renderCity()}
function generateTask(){let t={id:Date.now(),title:"護送商旅",due:serialDate()+10,city:state.city,reward:120};state.tasks.push(t);note("一名商人請你護送貨物，期限十日，報酬120錢。");renderCity()}
function showMap(){let c=CITIES[state.city];modal(`<div class="title">天下地圖／旅行</div><p>目前：${c.region}・${c.name}</p><div class="actions">${CITIES.map(x=>`<button onclick="travel(${x.id})">${x.region}・${x.name}</button>`).join("")}</div><div class="toolbar"><button onclick="closeModal()">關閉</button></div>`)}
function travel(id){if(id===state.city)return closeModal();let dist=3+Math.abs(id-state.city)%12;advance(dist);state.city=id;state.player.city=id;if(Math.random()<.25)note("旅途中遇到盤查與流民，你比預計稍感疲憊。");state.stamina=Math.max(20,state.stamina-dist);closeModal();renderCity()}
function showPeople(){let known=state.people.filter(p=>p.known);modal(`<div class="title">人物情報</div><p class="small">正常模式只顯示你合理掌握的資訊。</p>${known.map(p=>`<div class="msg"><b>${p.name}${p.zi?"・字"+p.zi:""}</b>　${p.age}歲<br>所在：${p.known>1?CITIES[p.city].name:"傳聞不詳"}　能力：${p.known>2?`統${p.stats.lead} 武${p.stats.war} 智${p.stats.int}`:"尚難判斷"}<br>關係：好感 ${p.relation.affection}／信任 ${p.relation.trust}／敬佩 ${p.relation.respect}</div>`).join("")||"尚未真正認識任何人物。"}<div class="toolbar"><button onclick="closeModal()">關閉</button></div>`)}
function showIntel(){modal(`<div class="title">情報</div><p>歷史偏離度：${state.historyDeviation}%</p><p>目前你掌握的世界資訊主要來自親身經歷與傳聞。相似說法越多且來源越獨立，可信度越高；但群體傳聞仍可能同源而錯誤。</p><div class="toolbar"><button onclick="closeModal()">關閉</button></div>`)}
function showTasks(){modal(`<div class="title">任務／待辦</div>${state.tasks.map(t=>`<div class="msg"><b>${t.title}</b>｜${CITIES[t.city].name}｜報酬${t.reward}錢</div>`).join("")||"目前沒有未完成任務。"}<div class="toolbar"><button onclick="closeModal()">關閉</button></div>`)}
function showJournal(){modal(`<div class="title">人物日誌</div>${state.journal.slice().reverse().map(x=>`<div class="msg">${x}</div>`).join("")}<div class="toolbar"><button onclick="closeModal()">關閉</button></div>`)}
function showFaction(){modal(`<div class="title">勢力／身分</div><p>所屬：${state.faction||"無"}</p><p>身分：${state.rank}</p><p>名聲：${state.fame}</p><p class="small">v0.1已建立勢力資料接口；派系、完整官職、外交與大規模戰爭將逐版深化。</p><div class="toolbar"><button onclick="closeModal()">關閉</button></div>`)}
function advance(days,txt){for(let i=0;i<days;i++){state.date.d++;state.turn++;if(state.date.d>30){state.date.d=1;state.date.m++;monthlyWorld()}if(state.date.m>12){state.date.m=1;state.date.y++;state.player.age++;state.people.forEach(p=>p.age++)}}if(txt)note(txt);historicalCheck();refreshSide();autoSave()}
function monthlyWorld(){
 state.people.forEach(p=>{
  if(!p.alive)return;
  if(Math.random()<.15)p.city=(p.city+rng(5)+28)%30;
  if(Math.random()<.08){
   let k=["lead","war","int","pol","cha"][rng(5)];
   p.stats[k]=Math.min(100,(p.stats[k]||60)+1);
  }
 });
 CITIES.forEach(c=>{c.price=Math.max(60,Math.min(180,c.price-5+rng(11)))});
}
function historicalCheck(){if(!state.flags.yellowTurban && state.date.y===184 && state.date.m>=4){state.flags.yellowTurban=true;state.historyDeviation=Math.max(state.historyDeviation,2);note("【天下大事】黃巾之亂愈演愈烈，各地開始大規模徵兵。");addJournal("黃巾之亂席捲各地，天下正式進入動盪。")}}
function quickSave(){if(!state)return;let slots=getSlots();slots[0]={name:"快速存檔",time:new Date().toLocaleString(),data:state};lsSet("sg_slots",JSON.stringify(slots));note("已快速存檔。");refreshSide()}
function autoSave(){if(!state||state.turn%5)return;lsSet("sg_auto",JSON.stringify(state))}
function continueGame(){let slots=getSlots();let s=slots.find(Boolean);if(s){state=migrate(s.data);enterGame();renderCity()}else{let a=lsGet("sg_auto","");if(a){state=migrate(JSON.parse(a));enterGame();renderCity()}else alert("目前沒有存檔。")}}
function getSlots(){let a=JSON.parse(lsGet("sg_slots","[]"));while(a.length<6)a.push(null);return a}
function openSaves(){let slots=getSlots();modal(`<div class="title">存檔管理</div>${slots.map((s,i)=>`<div class="msg">槽 ${i+1}：${s?`${s.name}｜${s.time}`:"空白"} <button onclick="saveSlot(${i})">儲存</button> ${s?`<button onclick="loadSlot(${i})">讀取</button>`:""}</div>`).join("")}<hr><div class="title">文字備份碼</div><textarea id="backup" rows="7" style="width:100%" placeholder="產生備份碼，或將備份碼貼到這裡"></textarea><div class="toolbar"><button onclick="exportCode()">產生備份碼</button><button onclick="importCode()">從文字恢復</button><button onclick="closeModal()">關閉</button></div>`)}
function saveSlot(i){if(!state)return alert("目前沒有進行中的人生");let a=getSlots();let name=prompt("存檔名稱",`存檔 ${i+1}`)||`存檔 ${i+1}`;a[i]={name,time:new Date().toLocaleString(),data:state};lsSet("sg_slots",JSON.stringify(a));openSaves()}
function loadSlot(i){let s=getSlots()[i];if(!s)return;state=migrate(s.data);closeModal();enterGame();renderCity()}
function exportCode(){if(!state)return alert("目前沒有遊戲可備份");let json=JSON.stringify({format:"SG3K",saveVersion:SAVE_VERSION,data:state});let bytes=new TextEncoder().encode(json);let bin="";bytes.forEach(b=>bin+=String.fromCharCode(b));document.getElementById("backup").value="SG3K-V01-"+btoa(bin)}
function importCode(){try{let x=document.getElementById("backup").value.trim().replace(/^SG3K-V01-/,"");let bin=atob(x),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0)),obj=JSON.parse(new TextDecoder().decode(bytes));state=migrate(obj.data);closeModal();enterGame();renderCity();quickSave()}catch(e){alert("備份碼無法辨識或已損壞。")}}
function migrate(s){if(!s.saveVersion)s.saveVersion=1;s.version=VERSION;return s}
function observerStart(){state=freshState({name:"觀察者",zi:"",sex:"",age:0,city:0,background:"",personality:"",stats:{lead:0,war:0,int:0,pol:0,cha:0},potential:{}});state.mode="observer";enterGame();scene("觀察者模式","世界將自行運作","你目前不扮演任何人物。可快速推演世界，之後再附身人物。",[["推演30日",()=>{advance(30);observerStartScene()}],["推演180日",()=>{advance(180);observerStartScene()}],["推演一年",()=>{advance(360);observerStartScene()}],["附身人物",observerPossess],["返回首頁",goHome]])}
function observerStartScene(){scene("觀察者模式",dateText(),"世界持續運作。主要人物會移動與成長，城市價格也在變化。",[["推演30日",()=>{advance(30);observerStartScene()}],["推演180日",()=>{advance(180);observerStartScene()}],["推演一年",()=>{advance(360);observerStartScene()}],["附身人物",observerPossess],["返回首頁",goHome]])}
function observerPossess(){modal(`<div class="title">選擇附身人物</div>${state.people.slice(0,30).map(p=>`<button style="margin:3px" onclick="possess('${p.id}')">${p.name}</button>`).join("")}<div class="toolbar"><button onclick="closeModal()">取消</button></div>`)}
function possess(id){let p=state.people.find(x=>x.id===id);state.player={name:p.name,zi:p.zi,sex:"",age:p.age,city:p.city,background:"史實人物",personality:"",stats:{...p.stats},potential:{lead:100,war:100,int:100,pol:100,cha:100},skills:{},exp:{}};state.city=p.city;state.mode="normal";closeModal();addJournal(`你在${dateText()}開始以${p.name}的身分行動。`);renderCity()}
function showChangelog(){modal(`<div class="title">更新紀錄</div><b>v0.1.1 Alpha</b><p>建立184年開局、30城資料、80名史實人物資料池、創角與模板、時間與旅行、修練、傳聞、人物情報、多維關係底層、基礎任務/仕官/戰鬥、觀察者模式、多槽存檔、自動存檔、文字備份碼與Migration基礎。</p><p class="small">這是第一個可持續擴充版本；完整216條藍圖會逐版實裝。</p><div class="toolbar"><button onclick="closeModal()">關閉</button></div>`)}
function refreshSide(){if(!state)return;document.getElementById("dateTop").textContent=dateText()+"｜"+CITIES[state.city].name;let p=state.player;document.getElementById("playerStats").innerHTML=`<div><b>${p.name}</b>${p.zi?"・字"+p.zi:""}</div><div class="small">${p.age?p.age+"歲｜":""}${state.rank}</div><div class="stat"><span>金錢</span><b>${state.money}</b></div><div class="stat"><span>名聲</span><b>${state.fame}</b></div><div class="stat"><span>體力</span><b>${state.stamina}</b></div><div class="stat"><span>健康</span><b>${state.health}</b></div>`;document.getElementById("abilities").innerHTML=Object.entries(p.stats||{}).map(([k,v])=>`<div class="stat"><span>${label(k)}</span><b>${v}</b></div>`).join("");document.getElementById("messages").innerHTML=state.messages.slice(-8).reverse().map(x=>`<div class="msg">${x}</div>`).join("")}
function scene(t,m,n,a){document.getElementById("sceneTitle").textContent=t;document.getElementById("sceneMeta").textContent=m||"";document.getElementById("narrative").textContent=n;document.getElementById("actions").innerHTML="";a.forEach(([x,f])=>{let b=document.createElement("button");b.textContent=x;b.onclick=f;document.getElementById("actions").appendChild(b)});refreshSide()}
function note(x){state.messages.push(`${dateText()}｜${x}`);if(state.messages.length>100)state.messages.shift()}
function addJournal(x){state.journal.push(`${dateText()}｜${x}`)}
function pay(n){if(state.money<n){alert("金錢不足。");return false}state.money-=n;return true}
function dateText(){return `${era(state.date.y)} ${state.date.m}月${state.date.d}日`}
function era(y){return y===184?"中平元年":`公元${y}年`}
function serialDate(){return state.date.y*360+state.date.m*30+state.date.d}
function label(k){return {lead:"統率",war:"武力",int:"智力",pol:"政治",cha:"魅力"}[k]||k}
function val(id){return document.getElementById(id).value}
function modal(x){document.getElementById("modalBox").innerHTML=x;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active")}
function goHome(){show("home")}
function toggleTheme(){if(!state)return;state.theme=state.theme==="dark"?"paper":"dark";document.body.dataset.theme=state.theme==="dark"?"dark":"";lsSet("sg_theme",state.theme)}

function bootCheck(){
 let el=document.getElementById("compat"); if(!el)return;
 let js=true, storage=false;
 try{localStorage.setItem("__sg_test","1");storage=localStorage.getItem("__sg_test")==="1";localStorage.removeItem("__sg_test")}catch(e){}
 let proto=location.protocol;
 let msg="✓ JavaScript 可執行";
 if(storage) msg+="　✓ 瀏覽器存檔可用";
 else msg+="　⚠ 此開啟方式無法使用瀏覽器永久存檔，請使用「文字備份碼」";

/* ===== v0.1.2 gameplay patch ===== */
const ROADS=[[0,1,5],[0,2,3],[0,4,3],[0,15,5],[1,29,6],[1,25,7],[2,3,2],[2,4,2],[2,7,5],[3,7,4],[4,5,2],[4,6,2],[4,15,4],[5,19,5],[7,8,3],[7,14,5],[8,9,3],[9,10,2],[8,11,6],[11,12,7],[11,13,6],[13,14,3],[14,29,7],[15,16,3],[16,17,3],[16,19,5],[17,18,4],[17,23,5],[18,23,5],[19,20,4],[20,21,2],[21,22,3],[20,23,4],[23,27,8],[25,26,4],[25,29,5],[25,24,7],[24,26,3],[24,27,4],[28,29,5]];
const HOME={"劉備":11,"關羽":11,"張飛":11,"曹操":0,"袁紹":0,"袁術":0,"孫堅":18,"董卓":28,"呂布":13,"丁原":13,"何進":0,"皇甫嵩":0,"朱儁":0,"盧植":0,"公孫瓚":11,"陶謙":10,"劉表":16,"劉焉":24,"馬騰":28,"韓遂":28,"張角":7,"張寶":7,"張梁":7,"荀彧":4,"郭嘉":4,"趙雲":7,"孔融":10,"王允":0,"蔡邕":0,"華佗":5,"張仲景":16};
const GOODS=["糧食","藥材","布匹","鐵器"];
const RUMORS=["黃巾軍在附近郡縣活動，但各方所報兵力不一。","北來商旅說道路不靖，部分商隊開始改道。","地方官府近日加強盤查，似乎正在防備變亂。","有遊俠談到附近豪傑正在招募鄉勇。","商旅認為近期糧價可能因戰事而波動。","有人看見一支來歷不明的隊伍在城外活動。"];

function ensureV12(){
 if(!state)return;
 state.saveVersion=2;state.version=VERSION;
 state.intel=state.intel||[];state.intelUsage=state.intelUsage||{};
 state.inventory=state.inventory||{旅糧:0,糧食:0,藥材:0,布匹:0,鐵器:0};
 ["旅糧",...GOODS].forEach(k=>state.inventory[k]=state.inventory[k]||0);
 state.world=state.world||CITIES.map(()=>({price:{糧食:70+rng(61),藥材:80+rng(71),布匹:70+rng(61),鐵器:90+rng(61)},govMax:1+rng(10),govDone:0,bandits:1+rng(4)}));
 state.people.forEach((p,i)=>{if(HOME[p.name]!==undefined&&state.turn===0)p.city=HOME[p.name];if(p.lastTalk===undefined)p.lastTalk=-99});
}
const oldFreshState=freshState;
freshState=function(p){let s=oldFreshState(p);state=s;ensureV12();let out=state;state=null;return out}
const oldEnterGame=enterGame;
enterGame=function(){ensureV12();oldEnterGame()}

function renderCity(){
 ensureV12();let c=CITIES[state.city],g=state.world[state.city];
 scene(c.name,`${c.region}｜治安 ${c.order}｜繁榮 ${c.prosperity}`,`你身在${c.name}。本月官府案件已處理 ${g.govDone}/${g.govMax}；城外匪患：${g.bandits?"仍有活動":"暫平"}。`,[
 ["前往酒肆",tavern],["前往市集",market],["修練",train],["打聽消息",intelMenu],["拜訪人物",visitPeople],["官府／仕官",government],["地圖／旅行",showMap],["休養／醫療",healMenu]
 ]);
}
function tavern(){
 advance(1);let pool=state.people.filter(p=>p.alive&&p.city===state.city),p=pool.length?pool[rng(pool.length)]:null;
 if(p)p.known=Math.max(p.known,1);
 scene("酒肆","消息、人脈與委託的交會處",p?`你注意到${p.known>1?p.name:"一名陌生人物"}。對方也察覺了你的目光。`:"今日沒有特別引人注目的人。",[
 ["主動攀談",()=>p?meet(p):noteBack("今日無人可談。")],["打聽消息",intelMenu],["花錢買可靠消息",()=>paidIntel(100,"較高")],["尋找委託",generateTask],["返回",renderCity]
 ]);
}
function meet(p){
 p.known=2;let cool=state.turn-p.lastTalk<3;p.lastTalk=state.turn;
 let tone=p.name==="張飛"?"此人聲若洪鐘，說話直來直往。":p.name==="曹操"?"此人言語不多，卻不時反問你的看法。":p.name==="關羽"?"此人神色沉穩，言談頗重信義。":"對方停下手邊之事，與你交談。";
 scene("主動攀談",p.zi?`${p.name}・字${p.zi}`:p.name,`${tone}${cool?"\n你近日已多次攀談，對方顯得有些意興闌珊。":""}`,[
 ["自我介紹",()=>talkResult(p,"affection",cool?0:2,"你們交換姓名與來歷。")],
 ["談論天下",()=>talkResult(p,"respect",cool?0:(state.player.stats.int>=65?3:1),"你談起時局，對方也給出自己的看法。")],
 ["請他喝酒（30錢）",()=>{if(pay(30))talkResult(p,"affection",cool?1:4,"酒過數巡，氣氛稍微熱絡。")}],
 ["打聽附近消息",intelMenu],["詢問武藝",()=>talkResult(p,"respect",cool?0:(state.player.stats.war>=65?3:1),"你們談起武藝與臨敵之道。")],["告辭",renderCity]
 ]);
}
function talkResult(p,k,n,txt){p.relation[k]+=n;advance(1);scene("交談結果",p.name,`${txt}\n${n?"你感覺彼此關係有所變化。":"短期內重複同類互動，沒有帶來新的進展。"}`,[["繼續交談",()=>meet(p)],["返回城中",renderCity]])}

function intelKey(){return `${state.date.y}-${state.date.m}-${state.city}-${Math.floor(state.fame/10)}-${state.rank}`}
function intelMenu(){
 ensureV12();let k=intelKey(),u=state.intelUsage[k]||0;
 scene("打聽消息",`本地免費情報探索 ${Math.min(u,4)}/4`,`免費打聽依靠時間、身份、名聲與人脈。${u>=4?"以你目前條件，能接觸的新消息已大致枯竭。":"目前仍可能找到新的傳聞。"}\n花錢可以換取較快、來源較可靠的消息，但不等於絕對真實。`,[
 ["免費打聽（1日）",freeIntel],["請酒套話（30錢）",()=>paidIntel(30,"普通")],["購買消息（100錢）",()=>paidIntel(100,"較高")],["可靠耳目（300錢）",()=>paidIntel(300,"高")],["情報紀錄",showIntel],["返回",renderCity]
 ]);
}
function freeIntel(){
 let k=intelKey(),u=state.intelUsage[k]||0;
 if(u>=4)return scene("情報枯竭","目前條件下已無新消息","近日坊間所談大抵如此。提升名聲、改變身份、完成工作或剿匪、前往別城後再來，才較可能有新消息。",[["返回",intelMenu]]);
 state.intelUsage[k]=u+1;advance(1);recordIntel(RUMORS[(u+state.city+state.date.m)%RUMORS.length],"市井傳聞","不明");showLastIntel();
}
function paidIntel(cost,cred){
 if(!pay(cost))return;advance(1);let w=state.world[state.city],msgs=[`官府本月尚有 ${Math.max(0,w.govMax-w.govDone)} 件差事可能承接。`,`城外目前約有 ${w.bandits} 股匪患活動跡象。`,`本城糧食行情約為 ${w.price.糧食} 錢。`,`有商旅稱近期${CITIES[state.city].region}道路情勢正在變化。`];
 recordIntel(msgs[rng(msgs.length)],cost>=300?"可靠耳目":cost>=100?"消息販子":"酒客",cred);showLastIntel();
}
function recordIntel(text,source,cred){state.intel.push({date:dateText(),city:state.city,text,source,cred});if(state.intel.length>80)state.intel.shift()}
function showLastIntel(){let x=state.intel[state.intel.length-1];scene("取得情報",`來源：${x.source}｜可信度：${x.cred}`,x.text,[["繼續打聽",intelMenu],["返回",renderCity]])}
function showIntel(){ensureV12();modal(`<div class="title">情報紀錄</div>${state.intel.slice().reverse().map(x=>`<div class="msg"><b>${x.date}・${CITIES[x.city].name}</b><br>${x.text}<br><span class="small">來源：${x.source}｜可信度：${x.cred}</span></div>`).join("")||"尚無情報紀錄。"}<div class="toolbar"><button onclick="closeModal()">關閉</button></div>`)}

function trainingDays(k){let s=state.player.stats[k],pot=state.player.potential[k]||85,gap=Math.max(1,pot-s),base=4+Math.floor(s/12)+Math.floor(Math.max(0,s-70)/4);return Math.max(3,Math.min(60,base+Math.floor(18/gap)))}
function train(){scene("修練","各能力依目前數值與隱藏潛力決定時間","每一項提升下一點所需時間不同；越接近自身瓶頸越慢。",["lead","war","int","pol","cha"].map(k=>[`${label(k)} ${state.player.stats[k]} → +1｜${trainingDays(k)}日`,()=>grow(k)]).concat([["取消",renderCity]]))}
function grow(k){let d=trainingDays(k),s=state.player.stats[k],pot=state.player.potential[k]||85;if(s>=100)return noteBack("正常修練已無法突破100。");advance(d);if(s<pot){state.player.stats[k]++;note(`${label(k)}提升至 ${state.player.stats[k]}。`)}else note(`${label(k)}已逼近自身瓶頸，這次未能突破。`);renderCity()}

function government(){
 ensureV12();let g=state.world[state.city],left=Math.max(0,g.govMax-g.govDone);
 scene("官府",`本月案件：${g.govDone}/${g.govMax} 已處理｜剩餘 ${left}`,state.faction?`目前身分：${state.rank}。官府案件並非無限產生。`:"你尚未正式仕官，但仍可承接部分地方差事。",[
 ["地方差役",()=>govPreview(false)],["剿匪差事",()=>govPreview(true)],["詢問政務（1日）",()=>{advance(1);noteBack("你對本地治安與民情多了一些了解。")}],["返回",renderCity]
 ]);
}
function govPreview(b){
 let g=state.world[state.city];if(g.govDone>=g.govMax)return noteBack("本月官府暫無新的差事。");if(b&&g.bandits<=0)return noteBack("附近匪患暫平，目前沒有剿匪差事。");
 let risk=b?(state.player.stats.war+state.player.stats.lead<125?"偏高":"普通"):"低";
 scene(b?"剿匪差事":"地方差役",`風險：${risk}`,`預計耗時：${b?"5日":"2～3日"}\n可能影響：金錢 ↑｜名聲 ↑｜體力 ↓${b?"｜健康 ↓（受傷風險）":""}`,[[ "接受",()=>b?banditBattle():localJob()],["暫不接受",government]]);
}
function localJob(){let g=state.world[state.city];g.govDone++;if(!state.faction){state.faction="地方官府";state.rank="佐吏"}advance(2+rng(2));state.money+=35;state.fame+=1;state.stamina=Math.max(20,state.stamina-8);relaxIntel();noteBack("差事完成，獲35錢，名聲略升。")}
function banditBattle(){let g=state.world[state.city];if(g.govDone>=g.govMax||g.bandits<=0)return government();g.govDone++;let power=state.player.stats.war+state.player.stats.lead+rng(40),enemy=115+rng(45);advance(5);state.stamina=Math.max(10,state.stamina-20);if(power>=enemy){g.bandits=Math.max(0,g.bandits-1);state.fame+=5;state.money+=100;note("剿匪成功，獲100錢與名聲。")}else{state.health=Math.max(1,state.health-10-rng(16));note("剿匪失利，你在混戰中受傷。")}relaxIntel();renderCity()}
function relaxIntel(){Object.keys(state.intelUsage).filter(k=>k.includes(`-${state.city}-`)).forEach(k=>state.intelUsage[k]=Math.max(0,state.intelUsage[k]-1))}

function generateTask(){
 let active=state.tasks.filter(t=>t.status==="active"&&t.from===state.city);if(active.length>=2)return noteBack("本地目前沒有新的合適委託。");
 let to=nearestDifferent(state.city),types=[["護送商旅",150],["送交書信",90],["護送藥材",130]],x=types[rng(types.length)];
 let t={id:Date.now(),title:x[0],from:state.city,to,client:`${CITIES[state.city].name}商人`,due:serialDate()+14,reward:x[1],status:"active",arrived:false};state.tasks.push(t);

function cityIntelMenu(){scene("城中探聽","市集、街坊、城門與行旅間的公開消息","這裡主要得到公開或半公開的城市資訊；與酒肆、特定人物的消息來源不同。",[["四處探聽（1日）",freeIntel],["觀察官府與城門（1日）",()=>{advance(1);let w=state.world[state.city];recordIntel(`${CITIES[state.city].name}目前由${(V13_FACTIONS[w.owner]||V13_FACTIONS.han).name}控制，城中駐軍約在${Math.round(w.garrison/1000)*1000}上下。`,"城中觀察","普通");showLastIntel()}],["情報紀錄",showIntel],["返回",renderCity]])}

function npcIntel(p){let trust=p.relation.trust||0,role=p.role||"";advance(1);let w=state.world[state.city],text;if(trust<3)text="對方只泛泛說了幾句，似乎還不願透露太多。";else if(p.skills.includes("medicine")||role.includes("醫"))text=`${p.name}提到本地近日傷病者${w.bandits>=3?"似乎有所增加":"並無明顯異常"}，藥材行情約${w.price.藥材}錢。`;else if(p.skills.includes("commerce")||role.includes("商"))text=`${p.name}說商路近期${w.bandits>=3?"不太安穩":"尚算平順"}，糧食行情約${w.price.糧食}錢。`;else if(p.skills.some(x=>["drill","formation","ambush","scout"].includes(x))||role.includes("軍"))text=trust>=8?`${p.name}低聲提到，本城駐軍約${Math.round(w.garrison/500)*500}，城外匪患約${w.bandits}股。`:`${p.name}只說城中軍備近日仍在整頓，不願談得太細。`;else text=`${p.name}提到近日${CITIES[state.city].name}街面${w.bandits>=3?"頗多人議論匪患":"大致平靜"}。`;recordIntel(text,p.name,trust>=8?"較高":trust>=3?"普通":"低");scene("人物消息",`來源：${p.name}｜信任 ${trust}`,text,[["繼續交談",()=>meet(p)],["返回城中",renderCity]])}
function npcTopics(p){let a=[["自我介紹",()=>talkResult(p,"affection",2,"你們交換姓名與來歷。")],["談論天下",()=>talkResult(p,"respect",state.player.stats.int>=65?3:1,"你談起時局，對方也說了自己的看法。")],["打聽附近消息",()=>npcIntel(p)]];let ss=p.skills||[];if(ss.some(x=>["spear","sword","blade","archery","riding","duel"].includes(x)))a.push(["請教武藝",()=>askTeach(p,"武藝")]);if(ss.some(x=>["drill","formation","ambush","scout","supply","siege"].includes(x)))a.push(["談論兵法",()=>askTeach(p,"兵法")]);if(ss.some(x=>["classics","writing","medicine","intel"].includes(x))||p.stats.int>=70)a.push(["請教學問",()=>askTeach(p,"技能")]);if(ss.some(x=>["govern","law","agriculture"].includes(x))||p.stats.pol>=70)a.push(["請教政務",()=>askTeach(p,"技能")]);a.push(["請他喝酒（30錢）",()=>{if(pay(30))talkResult(p,"affection",4,"酒過數巡，氣氛稍微熱絡。")}],["告辭",renderCity]);return a}
function meet(p){ensureV13();if(!p||p.adult===false)return noteBack("對方目前並非可正常社交的成年人物。");p.known=2;let cool=state.turn-(p.lastTalk??-99)<3;p.lastTalk=state.turn;scene("主動攀談",p.zi?`${p.name}・字${p.zi}`:p.name,`${p.role&&p.role!=="歷史人物"?p.role+"。":""}${cool?"你近日已多次找他交談，對方反應較為平淡。":"對方停下手邊之事，與你交談。"}`,npcTopics(p))}
function askTeach(p,cat){let choices=(p.skills||[]).map(v13SkillObj).filter(x=>x&&x.teach&&(cat==="技能"?x.cat==="技能":x.cat===cat));if(!choices.length)return talkResult(p,"respect",1,"你們交換了一些心得，但對方沒有適合傳授你的專門技藝。");let sk=choices[rng(choices.length)],rel=(p.relation.trust||0)+(p.relation.respect||0);advance(1);if(state.player.skillsV13[sk.id]){state.player.skillsV13[sk.id]=Math.min(3,state.player.skillsV13[sk.id]+(rel>=12&&Math.random()<.35?1:0));return scene("請教心得",p.name,`你向${p.name}請教「${sk.name}」。你已有基礎，這次主要加深理解。\n目前：${sk.name} Lv.${state.player.skillsV13[sk.id]}`,[["繼續交談",()=>meet(p)],["返回",renderCity]])}if(rel<6)return scene("請教未果",p.name,`${p.name}沒有直接拒絕，但只談了些皮毛。看來還需要更高的信任或敬佩。`,[["繼續交談",()=>meet(p)],["返回",renderCity]]);state.player.skillsV13[sk.id]=1;note(`你從${p.name}處學得「${sk.name}」入門。`);scene("有所傳授",p.name,`${p.name}願意指點你「${sk.name}」。\n你習得：${sk.name} Lv.1`,[["繼續交談",()=>meet(p)],["返回",renderCity]])}
function trainingHint(k){let s=state.player.stats[k],pot=state.player.potential[k]||85;if(s>=100)return"已達常人極限；需極罕見機緣才可能超越。";let gap=pot-s;if(gap<=0)return`${label(k)}已陷入瓶頸。一般修練很難再提升；可尋訪名師、實戰、任官、研讀典籍或等待特殊機緣。`;if(gap<=2)return"接近瓶頸：進展會明顯變慢。";if(gap<=6)return"漸感吃力：可能需要新的修練方式。";return"進展尚稱順利。"}
function train(){ensureV13();scene("修練","不公開隱藏潛力，但會提示目前狀態","五維遇到瓶頸並非故障；真正突破可能需要人物指點、實戰、任官、典籍或特殊事件。",["lead","war","int","pol","cha"].map(k=>[`${label(k)} ${state.player.stats[k]}｜${trainingDays(k)}日｜${trainingHint(k)}`,()=>grow(k)]).concat([["查看技能／武藝／兵法／特質",showSkills],["取消",renderCity]]))}
function showSkills(){ensureV13();let learned=Object.entries(state.player.skillsV13).map(([id,lv])=>{let x=v13SkillObj(id);return x?`${x.cat}・${x.name} Lv.${lv}`:""}).filter(Boolean);modal(`<div class="title">能力專長</div><p>目前習得：${learned.length?learned.join("、"):"尚無特殊技能"}</p><p class="small">本版能力池共 ${V13_SKILLS.length} 項。不是每個人物固定擁有若干項；符合關係、信任與能力條件後，可向歷史人物或原創NPC學習可傳授能力。</p><div class="toolbar"><button onclick="closeModal()">關閉</button></div>`)}
function generateTask(){ensureV13();let active=state.tasks.filter(t=>t.status==="active"&&t.from===state.city);if(active.length>=2)return noteBack("本地已有兩件進行中的委託。");let to=nearestDifferent(state.city),types=[["護送商旅",1.35],["送交書信",1.2],["護送藥材",1.45]],x=types[rng(types.length)],one=shortest(state.city,to),round=one*2,food=round*30,base=round*18,reward=Math.ceil((food+base)*x[1]/10)*10,t={id:Date.now(),title:x[0],from:state.city,to,client:`${CITIES[state.city].name}委託人`,due:serialDate()+Math.max(14,round+6),reward,status:"offered",arrived:false,travelDays:round,foodCost:food};state.pendingTask=t;scene("委託機會",`委託人：${t.client}`,`任務：${t.title}\n目的地：${CITIES[to].name}\n預計往返：${round}日\n建議旅糧：${round}份｜按目前30錢估算約${food}錢\n報酬：${reward}錢\n預估淨收益：約${reward-food}錢（未計途中額外事件）\n\n看到委託不代表已經接受。`,[["接受委託",()=>acceptTask(t)],["暫時考慮",()=>{state.pendingTask=t;noteBack("你暫時記下這件委託，尚未承諾。")}],["婉拒委託",()=>{state.pendingTask=null;noteBack("你婉拒了這件普通委託，沒有受到處罰。")}],["返回酒肆",tavern]])}
function acceptTask(t){t.status="active";state.tasks.push(t);state.pendingTask=null;note(`你接受委託「${t.title}」，報酬${t.reward}錢。`);renderCity()}
function turnIn(id){let t=state.tasks.find(x=>x.id===id);if(!t||!t.arrived||state.city!==t.from)return;let before=state.money;t.status="done";state.money+=t.reward;state.fame+=2;addJournal(`完成委託「${t.title}」，獲得${t.reward}錢。`);relaxIntel();refreshSide();modal(`<div class="title">委託完成</div><p>${t.title}</p><p>原有金錢：${before}<br>任務報酬：+${t.reward}<br><b>目前金錢：${state.money}</b></p><div class="toolbar"><button onclick="showTasks()">查看任務</button><button onclick="closeModal();renderCity()">返回</button></div>`)}
function market(){ensureV13();let p=state.world[state.city].price;scene("市集",`你有 ${state.money} 錢`,`本地行情：\n糧食 ${trend(p.糧食)} ${p.糧食}｜藥材 ${trend(p.藥材)} ${p.藥材}\n布匹 ${trend(p.布匹)} ${p.布匹}｜鐵器 ${trend(p.鐵器)} ${p.鐵器}\n旅糧：30錢／份｜目前持有 ${state.inventory.旅糧}`,[["做短工（+40錢／2日）",()=>{let b=state.money;state.money+=40;advance(2);relaxIntel();noteBack(`你做了兩日短工：${b} → ${state.money}錢。`)}],["購買旅糧（30錢）",buyRation],["交易商品",tradeMenu],["觀察物價（1日）",()=>{advance(1);scene("物價觀察","本地即時行情",`糧食：${trend(p.糧食)} ${p.糧食}\n藥材：${trend(p.藥材)} ${p.藥材}\n布匹：${trend(p.布匹)} ${p.布匹}\n鐵器：${trend(p.鐵器)} ${p.鐵器}`,[["返回市集",market]])}],["返回",renderCity]])}
function buyRation(){let before=state.money,q=state.inventory.旅糧;if(!pay(30))return;state.inventory.旅糧++;refreshSide();scene("購買完成","旅糧 +1",`金錢：${before} → ${state.money}\n旅糧：${q} → ${state.inventory.旅糧}`,[["再買1份",buyRation],["返回市集",market],["返回城中",renderCity]])}
function government(){ensureV13();let g=state.world[state.city],f=V13_FACTIONS[g.owner]||V13_FACTIONS.han,left=Math.max(0,g.govMax-g.govDone);if(state.faction)scene("官府／仕官",`所屬：${state.faction}｜身分：${state.rank}`,`目前所在地屬於${f.name}。本月尚有${left}件地方差事。`,[["地方差役",()=>govPreview(false)],["剿匪差事",()=>govPreview(true)],["詢問政務（1日）",()=>{advance(1);noteBack("你對本地政務多了一些了解。")}],["辭去目前身分",()=>{state.faction=null;state.rank="平民";noteBack("你離開了目前的官府身分。")}],["返回",renderCity]]);else scene("官府／仕官",`所在地：${f.name}｜${g.governor}`,`你目前是平民。可以毛遂自薦，也可以先累積名聲、能力與人物關係後再來。`,[["自我推薦",selfRecommend],["承接地方差事（不等於仕官）",()=>govPreview(false)],["詢問政務（1日）",()=>{advance(1);noteBack("你對本地政務多了一些了解。")}],["返回",renderCity]])}
function selfRecommend(){let w=state.world[state.city],f=V13_FACTIONS[w.owner]||V13_FACTIONS.han,avg=(state.player.stats.lead+state.player.stats.war+state.player.stats.int+state.player.stats.pol+state.player.stats.cha)/5,score=state.fame+Math.max(0,avg-55);advance(1);if(score>=18){state.faction=f.name;state.rank=state.player.stats.pol>=state.player.stats.war?"書佐":"軍中佐吏";state.fame+=2;addJournal(`你在${CITIES[state.city].name}自我推薦，獲${f.name}錄用為${state.rank}。`);return noteBack(`自薦獲得錄用。你現在隸屬${f.name}，身分為${state.rank}。`)}scene("自薦未果",f.name,`官署聽過你的自述後，暫未正式錄用。\n目前較可行的方向：提高名聲、完成地方差事、提升能力，或取得有份量人物的引薦。`,[["返回官府",government],["返回城中",renderCity]])}
function localJob(){let g=state.world[state.city];g.govDone++;advance(2+rng(2));state.money+=35;state.fame+=1;state.stamina=Math.max(20,state.stamina-8);relaxIntel();noteBack("差事完成，獲35錢，名聲略升。這只是承接差事，不會自動加入勢力。")}
function showFaction(){ensureV13();let w=state.world[state.city],f=V13_FACTIONS[w.owner]||V13_FACTIONS.han;modal(`<div class="title">勢力／身分</div><p><b>目前城市：${CITIES[state.city].name}</b><br>所屬勢力：${f.name}<br>統治／官署：${w.governor}<br>駐軍：約${Math.round(w.garrison/500)*500}<br>軍事情勢：${w.military}</p><hr><p>你的所屬：${state.faction||"無"}<br>身分：${state.rank}<br>名聲：${state.fame}</p><div class="toolbar"><button onclick="closeModal()">關閉</button></div>`)}
const v13OldRefresh=refreshSide;refreshSide=function(){ensureV13();v13OldRefresh();if(state&&document.getElementById("playerStats")){let w=state.world[state.city],f=V13_FACTIONS[w.owner]||V13_FACTIONS.han;document.getElementById("playerStats").innerHTML+=`<div class="stat"><span>所在地勢力</span><b>${f.name}</b></div>`}}
showChangelog=function(){modal(`<div class="title">更新紀錄</div><b>v0.1.3 Alpha</b><p>修正旅糧扣款與任務報酬顯示；委託改為可接受／考慮／拒絕並依往返旅費計算最低合理報酬；新增城池所屬勢力、官署、駐軍與軍事情勢；加入自我推薦仕官；重整歷史人物地域與成年登場，加入原創NPC；拆分城中、酒肆、NPC三層情報；NPC依專長出現文武話題；加入30項技能／武藝／兵法／特質能力池與條件式傳授；五維瓶頸加入提示。</p><p class="small">v0.1.2存檔可讀取，系統會補齊v0.1.3資料。</p><div class="toolbar"><button onclick="closeModal()">關閉</button></div>`)}

</script>
